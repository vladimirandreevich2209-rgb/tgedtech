<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F4F0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SMC Speech" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>SMC Speech — Диагностика звука [Р] за 3 минуты</title>
    <meta name="description" content="Бесплатный диагностический Блок 0 научного речевого тренажера исправления звука [Р] у взрослых." />
    <meta property="og:title" content="SMC Speech — Диагностика звука [Р] за 3 минуты" />
    <meta property="og:description" content="Проверим анатомию, запишем Точку А и покажем на графике, где именно теряется вибрация." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        var h = window.location.hash || '';
        var s = window.location.search || '';
        if (
          h.indexOf('tgWebAppData') !== -1 ||
          s.indexOf('tgWebAppStartParam') !== -1 ||
          typeof window.TelegramWebviewProxy !== 'undefined'
        ) {
          var el = document.createElement('script');
          el.async = true;
          el.src = './telegram-web-app.js';
          el.onload = function () {
            try {
              var wa = window.Telegram && window.Telegram.WebApp;
              if (wa) {
                wa.ready && wa.ready();
                wa.expand && wa.expand();
                if (wa.isVersionAtLeast && wa.isVersionAtLeast('7.7') && wa.disableVerticalSwipes) {
                  wa.disableVerticalSwipes();
                }
              }
            } catch (e) {}
          };
          document.head.appendChild(el);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
